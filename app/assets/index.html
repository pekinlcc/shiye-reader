<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>拾页 · 私人书房</title><link rel="stylesheet" href="style.css"></head><body>
<section id="shelf"><header><div class="brand"><span class="logo">册</span><div><strong>拾页</strong><small>把时间留给阅读</small></div></div><span class="offline">● 离线书房</span></header>
<div class="intro"><div><p class="eyebrow">YOUR PERSONAL LIBRARY</p><h1>书中自有，辽阔天地。</h1><p id="summary">正在整理你的书架…</p></div><div class="line-art" aria-hidden="true">山海万卷<br><span>一页一世界</span></div></div>
<div id="continue" hidden></div><div class="shelf-tools"><div><h2>我的书架 <span id="count"></span></h2><div class="filters" role="group" aria-label="书架筛选"><button class="selected" data-filter="all" aria-pressed="true">全部书籍</button><button data-filter="reading" aria-pressed="false">正在阅读</button><button data-filter="epub" aria-pressed="false">电子书</button><button data-filter="pdf" aria-pressed="false">PDF</button></div></div><div class="search-tools"><button id="importBtn" class="primary">＋ 导入书籍</button><input id="search" type="search" placeholder="搜索书名、作者" aria-label="搜索书名、作者"><select id="sort" aria-label="书架排序"><option value="title">书名排序</option><option value="recent">最近阅读</option></select></div></div>
<div id="grid"></div><div id="empty" role="status" hidden></div><footer>拾页 · 一间随身携带的私人书房</footer></section>
<section id="reader" hidden><div class="reader-top"><button id="back">‹ 书架</button><div class="reading-title"><strong id="bookTitle"></strong><small id="chapterTitle"></small></div><button id="tocButton">目录</button><button id="settingsButton" aria-label="阅读设置">Aa</button></div><div id="frameWrap"><iframe id="page" title="电子书正文" sandbox="allow-same-origin"></iframe><div id="loading" role="status">正在翻开这一页…</div></div><div class="reader-bottom"><button id="prev">← 上一页</button><div><span id="progress" role="status"></span><small>左右滑动翻页 · 点击正文显隐菜单</small></div><button id="next">下一页 →</button></div></section>
<div id="shade" hidden></div><aside id="toc" role="dialog" aria-modal="true" aria-label="章节目录" hidden><div class="panel-heading"><h2>章节目录</h2><button class="close">关闭</button></div><input id="tocSearch" type="search" placeholder="搜索章节" aria-label="搜索章节"><div id="tocList"></div></aside>
<aside id="settings" role="dialog" aria-modal="true" aria-label="阅读设置" hidden><div class="panel-heading"><h2>阅读设置</h2><button class="close">关闭</button></div><p id="fontLabel">文字大小</p><div class="setting-row" role="group" aria-labelledby="fontLabel"><button id="smaller" aria-label="缩小字号">A－</button><span id="fontValue" role="status"></span><button id="larger" aria-label="放大字号">A＋</button></div><p id="paperLabel">纸张与光线</p><div class="themes" role="group" aria-labelledby="paperLabel"><button data-theme="paper">素纸</button><button data-theme="sepia">暖页</button><button data-theme="dark">夜读</button></div><p id="layoutLabel">阅读排版</p><div class="themes" role="group" aria-labelledby="layoutLabel"><button data-cols="1">单栏</button><button data-cols="2">双栏</button></div><p id="zenLabel">阅读界面</p><div class="themes" role="group" aria-labelledby="zenLabel"><button id="zenToggle" aria-pressed="true">全屏阅读</button></div><p class="hint">全屏阅读时点击正文即可显示或隐藏上下菜单栏。系统状态栏已隐藏，从屏幕边缘下滑可临时唤出。</p></aside>
<div id="toast" role="status" aria-live="polite" hidden></div><script src="app.js"></script></body></html>
